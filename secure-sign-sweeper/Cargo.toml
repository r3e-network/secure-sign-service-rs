[package]
name = "secure-sign-sweeper"
version = "0.1.0"
edition = "2021"

[dependencies]
secure-sign-core = { path = "../secure-sign-core", features = ["std"] }
secure-sign-neo-rpc = { path = "../secure-sign-neo-rpc" }
secure-sign-rpc = { path = "../secure-sign-rpc" }

base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
hex = "0.4"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
url = "2"

[dev-dependencies]
tempfile = "3"
