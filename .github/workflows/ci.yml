name: ci

# This repository had no workflows at all. It holds the custody signer, so
# "compiles and its tests pass" was being asserted by nothing outside a
# workstation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # There is no rust-toolchain.toml here, so the runner's default toolchain
      # decides the compiler. Adding one is a repository decision with a
      # reproducibility argument behind it (neo-os-services pins 1.98.0) and is
      # left to the owner rather than made implicitly by this file.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # secure-sign-core's build script compiles the signer's .proto files with
      # prost/tonic, which shells out to protoc. The stock runner has none, so
      # the Check step below failed at "Could not find `protoc`" before a
      # single crate compiled.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      # --workspace covers the seven members listed in Cargo.toml. The two SGX
      # crates (secure-sign-sgx, secure-sign-sgx-enclave) are separate
      # workspaces, not members.
      - name: Check
        run: cargo check --workspace --all-targets

      # The SGX HOST crate type-checks on a stock runner: `cargo check` does not
      # link, so the missing SGX SDK library does not matter here. It is checked
      # explicitly because it once stopped compiling (2x E0046, missing trait
      # methods) and nothing noticed - a crate CI never looks at regresses
      # silently. The ENCLAVE crate needs the SGX target and SDK to build at all,
      # so it stays out.
      - name: Check SGX host crate
        run: cargo check --manifest-path secure-sign-sgx/Cargo.toml --all-targets --locked

      - name: Test
        run: cargo test --workspace

  dependency-audit:
    # Deliberately separate from build-and-test and deliberately not a
    # dependency of it: an advisory is news about the outside world, and letting
    # it block an unrelated change is how a repository learns to ignore its own
    # CI. Keep this off the required list and read it.
    #
    # EXPECTED RED until the owner decides on rsa. `cargo audit` exits 1 on:
    #
    #   rsa 0.9.10      RUSTSEC-2023-0071 Marvin, no fixed upgrade published.
    #                   Only the optional `vsock` feature of secure-sign pulls it
    #                   in; it needs a written risk acceptance in audit.toml (or
    #                   removal of that path), not a silent pass.
    #
    # rustls RUSTSEC-2026-0285 was fixed by the lockfile bump to 0.23.45.
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
