[package]
name = "secure-sign-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
secure-sign-core = { path = "../secure-sign-core", features = ["std"] }
secure-sign-rpc = { path = "../secure-sign-rpc" }

clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"

[dev-dependencies]
tempfile = "3"
