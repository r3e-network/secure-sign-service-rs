[package]
name = "secure-sign-gateway"
version = "0.2.0"
edition = "2021"

[dependencies]
secure-sign-core = { path = "../secure-sign-core", features = ["std"] }
secure-sign-neo-rpc = { path = "../secure-sign-neo-rpc" }
secure-sign-rpc = { path = "../secure-sign-rpc" }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
redb = "4.2"
prost = "0.13"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
